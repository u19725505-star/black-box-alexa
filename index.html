<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Black Box for Alexa+</title>
<link rel="stylesheet" href="style.css?v=2">
<script>
window.addEventListener('error',function(e){
  var b=document.getElementById('err');
  if(!b){b=document.createElement('div');b.id='err';b.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#7f1d1d;color:#fff;padding:8px 12px;font:12px monospace;z-index:99';document.body.appendChild(b)}
  b.textContent='Error: '+e.message+' ('+String(e.filename||'').split('/').pop()+':'+e.lineno+')';
});
</script>
</head>
<body data-orb="idle">
<div class="bg"></div>
<header>
  <div class="brand"><div class="orb"></div><div><h1>Black Box <span>for Alexa+</span></h1><p>See it · explain it · undo it</p></div></div>
  <div class="hctl">
    <span id="pill" class="pill">chain: empty</span>
    <button id="vbtn" class="ib" title="Voice on/off">🔊</button>
    <button id="demo" class="go">▶ Run demo</button>
  </div>
</header>
<div class="strip-wrap"><div class="strip" id="strip"></div></div>
<nav class="tabs" id="tabs">
  <button class="on" data-tab="assistant">Assistant</button>
  <button data-tab="ledger">Ledger</button>
  <button data-tab="rails">Guardrails</button>
  <button data-tab="home">Home</button>
  <i class="ind" id="ind"></i>
</nav>
<main>
  <section class="panel active" id="p-assistant">
    <div class="card">
      <h2>Alexa+ (simulated)</h2>
      <div id="chat"></div>
      <div class="row">
        <input type="text" id="inp" placeholder="Say or type a request..." autocomplete="off">
        <button class="ib" id="mic" title="Talk">🎤</button>
        <button class="go" id="send">Send</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </section>
  <section class="panel" id="p-ledger">
    <div class="card">
      <h2>Black Box ledger</h2>
      <div class="stats" id="stats"></div>
      <div class="chips" style="margin:0 0 6px">
        <button id="verify" class="go">Verify chain</button>
        <button id="tamper">Tamper demo</button>
        <button id="reset">Reset</button>
      </div>
      <div class="chips" id="filters"></div>
      <div id="ledger"></div>
    </div>
  </section>
  <section class="panel" id="p-rails">
    <div class="card">
      <h2>Guardrails</h2>
      <div class="ctl"><div>Ask before spending over<small id="limv">$25</small></div><input type="range" id="lim" min="5" max="200" step="5" value="25"></div>
      <div class="ctl"><div>Quiet hours<small>No thermostat changes at night</small></div><label class="sw"><input type="checkbox" id="qh" checked><i></i></label></div>
      <div class="ctl"><div>Simulated time<small id="timev">3:00 PM</small></div><label class="sw"><input type="checkbox" id="nt"><i></i></label></div>
    </div>
  </section>
  <section class="panel" id="p-home">
    <div class="card">
      <h2>Simulated home</h2>
      <div class="home" id="home"></div>
    </div>
  </section>
</main>
<footer>Simulated Alexa+ experience · MIT licensed · no real devices or purchases</footer>
<div id="toasts"></div>
<script src="core.js?v=2"></script>
<script src="ui.js?v=2"></script>
<script src="main.js?v=2"></script>
<script src="fix.js?v=1"></script>
</body>
</html>
